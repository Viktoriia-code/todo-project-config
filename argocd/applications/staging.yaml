apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-project-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Viktoriia-code/todo-project-config.git
    path: environments/overlays/staging
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
